function title(k){return MODULES.find(x=>x.id===k)?.name||k}function labelScore(n){return n===null?'Pendente':n>=85?'Alta':n>=70?'Aceitável':n>=60?'Em desenvolvimento':n>=40?'Baixa':'Crítica'}
function meters(c){const d=calc(c);return MODULES.map(m=>{const v=d.moduleScores[m.id];return `<div class="module-row"><span class="label-name">${m.name}</span><div class="bar ${v===null||v<40?'red':v>=70?'green':''}"><span style="width:${v===null?0:v}%"></span></div><span class="score">${v===null?'—':fmt(v)}</span></div>`}).join('')}
function ring(n){const v=n??0;const a=v/100*2*Math.PI*65,full=2*Math.PI*65;return `<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Pontuação geral ${n===null?'indisponível':fmt(n)}"><circle cx="80" cy="80" r="65" fill="none" stroke="#e8efef" stroke-width="14"/><circle cx="80" cy="80" r="65" fill="none" stroke="${n===null?'#a8b5bb':'#176f70'}" stroke-width="14" stroke-dasharray="${a} ${full-a}" transform="rotate(-90 80 80)" stroke-linecap="round"/><text x="80" y="76" text-anchor="middle" font-size="28" font-weight="800" fill="#172b38">${n===null?'—':fmt(n)}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="#778995">de 100 pontos</text></svg>`}
function dimRows(c){const d=calc(c);return Object.keys(dims).map(k=>{const v=d.dimensionScores[k];const m=MODULES.find(x=>x.id===k.slice(0,3));return `<div class="module-row"><span class="label-name">${k} · ${esc(DIMN[k]||'')}</span><div class="bar ${v==null||v<40?'red':v>=70?'green':''}"><span style="width:${v==null?0:v}%"></span></div><span class="score">${v==null?'—':fmt(v)}</span></div>`}).join('')}
function welcome(){if(localStorage.getItem('dma-welcome-off'))return '';return `<section class="box no-print" id="welcomeBox"><div class="section-head"><h2>Como usar</h2><button class="smallbtn" id="hideWelcome">Entendi, ocultar</button></div><p>1) Em <b>Configurações</b>, informe a clínica e o avaliador (ou crie uma em <b>+ Nova clínica</b>). 2) Em <b>Diagnóstico</b>, dê nota 0–4 a cada verificação; use NA quando não se aplicar e NV (deixar sem resposta) quando ainda não verificou. 3) Veja o resultado na <b>Visão geral</b>, o <b>Plano de ação</b> e o <b>Relatório REDA</b>. Esta versão traz uma clínica de <b>exemplo</b>: use <i>Configurações → Limpar respostas desta clínica</i> para começar do zero. Os dados ficam só neste navegador: use <b>Exportar dados</b> para guardar um backup.</p></section>`}
function renderDashboard(){const c=cur(),d=calc(c);$('dashboard').innerHTML=welcome()+`<section class="cards"><div class="card"><div class="kicker">Índice DMA geral</div><div class="metric">${d.index===null?'—':fmt(d.index)}<small> /100</small></div><span class="badge ${d.index===null?'':d.index>=70?'good':'warn'}">${d.classification}</span></div><div class="card"><div class="kicker">Diagnóstico preenchido</div><div class="metric">${d.complete}<small> /106</small></div><div class="hint">${pct(d.complete/106*100)} de verificações respondidas</div><div class="progress-line"><b style="width:${d.complete/106*100}%"></b></div></div><div class="card"><div class="kicker">Evidências registradas</div><div class="metric">${pct(d.coverage)}</div><div class="hint">${d.documented} de ${d.eligible} itens com nota</div></div><div class="card"><div class="kicker">Riscos críticos declarados</div><div class="metric">${d.critical}</div><div class="hint">${d.high} riscos altos · ${d.blockers.length} controles-gatilho pendentes</div></div></section><section class="grid2"><div class="box"><div class="section-head"><h2>Maturidade por área</h2><span class="tag">5 módulos</span></div><p>Notas ponderadas por dimensão e módulo, conforme metodologia DMA.</p>${meters(c)}<div class="footnote">A nota geral só é exibida quando todos os itens estão respondidos (ou NA com justificativa).</div></div><div class="box"><h2>Composição do diagnóstico</h2><p>Distribuição dos pesos no índice global.</p><div class="donut-wrap">${ring(d.index)}<div class="legend">${MODULES.map(m=>`<div class="legend-item"><span><i class="dot" style="background:${m.color}"></i>${m.name}</span><strong>${fmt(weights[m.id])}%</strong></div>`).join('')}</div></div></div></section><section class="box"><div class="section-head"><h2>Maturidade por dimensão</h2><span class="tag">25 dimensões</span></div><p>Mostra onde está o problema dentro de cada módulo.</p>${dimRows(c)}</section><section class="grid2"><div class="box"><div class="section-head"><h2>Situação para implantação</h2><span class="badge ${d.ready?'good':'warn'}">${esc(d.decision)}</span></div><p>Além da nota, avaliamos evidências, controles críticos e notas mínimas de financeiro e pessoal.</p><div class="recommend">${recommendation(d)}</div><button class="btn dark no-print" data-go="report">Ver relatório REDA</button></div><div class="box"><h2>Distribuição das notas</h2><p>Quantidade de verificações por nota (itens não aplicáveis são separados).</p><div class="mini-chart">${[0,1,2,3,4].map(i=>{const n=QQ.filter(q=>answer(c,q.id).score===i).length;return `<span title="Nota ${i}: ${n}" style="height:${Math.max(5,n/Math.max(1,...[0,1,2,3,4].map(j=>QQ.filter(q=>answer(c,q.id).score===j).length))*100)}%;background:${i<=1?'#b98162':i===2?'#c1a16d':'#2e8580'}"></span>`}).join('')}</div><div class="legend-item">${[0,1,2,3,4].map(i=>`<span>${i}: <strong>${QQ.filter(q=>answer(c,q.id).score===i).length}</strong></span>`).join('')}</div><div class="footnote">Notas 0 e 1: ${d.low} verificações</div></div></section>`}
function recommendation(d){if(d.complete<106)return `Faltam ${106-d.complete} verificações. Termine o preenchimento para obter o índice final. Registre as evidências antes de avaliar a prontidão.`;if(d.critical||d.blockers.length)return `Não homologar integralmente sem revisar os riscos críticos e os controles-gatilho (${d.blockers.join(', ')||'verificações classificadas críticas'}). Recomenda-se plano de correções e liberação por processo.`;if(d.coverage<state.config.evidenceMin)return `A nota está calculada, mas a documentação de evidências está abaixo do mínimo de ${state.config.evidenceMin}%. Validar registros e amostras antes da homologação.`;if(d.ready)return `Diagnóstico atende aos critérios automáticos preliminares. A direção deverá revisar riscos, capacidade, horas e aprovar a implantação por processo.`;return `Recomenda-se implantação condicionada, com estruturação dos controles de financeiro e pessoal, supervisão e evidências de funcionamento antes da transferência.`}
function questionCard(q,c){const a=answer(c,q.id),expanded=showDetails[q.id]||!!a.evidence||!!a.finding||!!a.action||!!a.risk;return `<article class="qcard" id="q-${q.id}"><div class="qhead"><div><div class="qcode">${esc(q.id)} · ${esc(title(q.m))} · ${esc(q.dim)}</div><h3>${esc(q.question)}</h3><div class="qtitle">${esc(q.title)}</div></div><button class="smallbtn" data-expand="${q.id}">${expanded?'Recolher':'Detalhes / evidências'}</button></div><div class="score-buttons">${[0,1,2,3,4,'NA'].map(n=>`<button data-score="${q.id}|${n}" class="${a.score===n?'chosen':''} ${n==='NA'?'na':''}" title="${n==='NA'?'Não aplicável':(['Inexistente','Informal','Parcial','Estruturado','Controlado'][n])}">${n}</button>`).join('')}<span class="mini-note" style="align-self:center;margin-left:auto">${a.score===undefined?'Não respondido':a.score==='NA'?'Não aplicável':['Inexistente','Informal','Parcial','Estruturado','Controlado'][a.score]}</span></div><div class="detail-grid ${expanded?'':'hidden'}" id="detail-${q.id}"><label class="field">Método de coleta<select data-field="${q.id}|method"><option value="">Selecionar</option>${['Entrevista','Observação','Documentos / evidências','Método combinado'].map(t=>`<option ${a.method===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Risco<select data-field="${q.id}|risk">${['Não classificado','Baixo','Médio','Alto','Crítico'].map(t=>`<option ${a.risk===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">ID / descrição da evidência<input data-field="${q.id}|evidence" value="${esc(a.evidence||'')}" placeholder="Ex.: EVD-018 — relatório conciliado"></label><label class="field">Responsável<input data-field="${q.id}|owner" value="${esc(a.owner||'')}" placeholder="Responsável pela ação"></label><label class="field">Achado / observação<textarea data-field="${q.id}|finding" placeholder="O que foi observado?">${esc(a.finding||'')}</textarea></label><label class="field">Ação recomendada / condição<textarea data-field="${q.id}|action" placeholder="Providência e prazo previsto">${esc(a.action||'')}</textarea></label>${a.score==='NA'?`<label class="field" style="grid-column:1/-1">Justificativa de não aplicação<textarea data-field="${q.id}|justification">${esc(a.justification||'')}</textarea></label>`:''}</div></article>`}
function renderQuestions(){const c=cur();const selected=QQ.filter(q=>(moduleFilter==='TODOS'||q.m===moduleFilter)&&(statusFilter==='TODOS'||(statusFilter==='PENDENTE'&&answer(c,q.id).score===undefined)||(statusFilter==='CRITICO'&&['Alto','Crítico'].includes(answer(c,q.id).risk)))&&(`${q.id} ${q.question} ${q.title}`).toLowerCase().includes(search.toLowerCase()));$('questions').innerHTML=`<section class="box no-print" style="padding:18px"><div class="section-head"><h2>Questionário DMA</h2><span class="tag">106 verificações · 5 módulos</span></div><div class="filters"><select id="moduleFilter"><option value="TODOS">Todos os módulos</option>${MODULES.map(m=>`<option value="${m.id}" ${moduleFilter===m.id?'selected':''}>${m.name}</option>`).join('')}</select><select id="statusFilter"><option value="TODOS">Todas</option><option value="PENDENTE" ${statusFilter==='PENDENTE'?'selected':''}>Não respondidas</option><option value="CRITICO" ${statusFilter==='CRITICO'?'selected':''}>Riscos altos/críticos</option></select><input id="searchQ" placeholder="Buscar pergunta ou código…" value="${esc(search)}"><span class="badge">${selected.length} itens</span></div><div class="help">Escala: 0 inexistente · 1 informal · 2 parcial · 3 estruturado · 4 controlado · NA não aplicável. Abra “Detalhes” para registrar evidências e riscos. Não armazene senhas ou dados clínicos.</div></section><section id="questionList">${selected.map(q=>questionCard(q,c)).join('')||'<div class="empty">Nenhuma pergunta encontrada.</div>'}</section>`}
function reportRows(c){const d=calc(c);return MODULES.map(m=>{const s=d.moduleScores[m.id];return `<tr><td><strong>${m.name}</strong></td><td>${fmt(weights[m.id])}%</td><td>${s===null?'Pendente':fmt(s)}</td><td>${s===null?'Não concluído':labelScore(s)}</td></tr>`}).join('')}
function priorityRows(c){const items=QQ.map(q=>({q,a:answer(c,q.id)})).filter(x=>(Number.isInteger(x.a.score)&&x.a.score<=1)||['Alto','Crítico'].includes(x.a.risk)).sort((a,b)=>{const r={'Crítico':-10,'Alto':-5};return (r[a.a.risk]??a.a.score)-(r[b.a.risk]??b.a.score)}).slice(0,12);return items.map(({q,a})=>`<tr><td><strong>${q.id}</strong><div class="muted">${title(q.m)}</div></td><td>${esc(q.title)}</td><td>${a.score??'—'}</td><td>${esc(a.risk||'Não classificado')}</td><td>${esc(a.action||'Definir correção e validar evidência')}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum item prioritário identificado por regra automática.</td></tr>'}
function renderReport(){const c=cur(),d=calc(c);let highlights=MODULES.filter(m=>d.moduleScores[m.id]!==null).sort((a,b)=>d.moduleScores[a.id]-d.moduleScores[b.id]).slice(0,2).map(m=>m.name).join(' e ');$('report').innerHTML=`<div class="print-header"><div class="eyebrow">DMA STUDIO · RELATÓRIO EXECUTIVO</div></div><section class="report-hero"><div><div class="eyebrow" style="color:#a9dfd7">REDA · DIAGNÓSTICO ADMINISTRATIVO</div><h2 style="font-size:24px;margin:9px 0">${esc(c.name)}</h2><p>Data: ${esc(c.date||'Não informada')} &nbsp;·&nbsp; Avaliador: ${esc(c.manager||'Não informado')}</p><span class="badge ${d.ready?'good':'warn'}">${esc(d.decision)}</span></div><div style="text-align:right"><div style="color:#bdd1d3;font-size:11px">MATURIDADE GERAL</div><div class="metric">${d.index===null?'—':fmt(d.index)}<small style="color:#afc9cb"> /100</small></div><div>${esc(d.classification)}</div></div></section><section class="cards" style="margin-top:16px"><div class="card"><div class="kicker">Verificações</div><div class="metric" style="font-size:25px">${d.complete}/106</div></div><div class="card"><div class="kicker">Evidências</div><div class="metric" style="font-size:25px">${pct(d.coverage)}</div></div><div class="card"><div class="kicker">Riscos críticos</div><div class="metric" style="font-size:25px">${d.critical}</div></div><div class="card"><div class="kicker">Notas 0 ou 1</div><div class="metric" style="font-size:25px">${d.low}</div></div></section><section class="grid2" style="margin-top:16px"><div class="box"><h2>Maturidade por módulo</h2>${meters(c)}</div><div class="box"><h2>Resumo executivo</h2><p>${d.index===null?'O diagnóstico ainda está em preenchimento.':'A classificação automática é '+d.classification.toLowerCase()+' ('+fmt(d.index)+'/100).'} ${highlights?'Os módulos com menores notas disponíveis são '+esc(highlights)+'.':''}</p><div class="recommend">${recommendation(d)}</div><p><strong>Interpretação:</strong> os indicadores apoiam a decisão gerencial, mas não substituem revisão documental e análise da direção.</p></div></section><section class="box report-section"><h2>Matriz de pontuações</h2><div class="table-wrap"><table class="table"><thead><tr><th>Módulo</th><th>Peso</th><th>Nota /100</th><th>Nível</th></tr></thead><tbody>${reportRows(c)}</tbody></table></div></section><section class="box report-section"><h2>Ações prioritárias sugeridas</h2><p>Seleção automática de itens de baixo desempenho ou risco elevado. O plano definitivo deve incluir responsáveis e datas após revisão.</p><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Verificação</th><th>Nota</th><th>Risco</th><th>Ação</th></tr></thead><tbody>${priorityRows(c)}</tbody></table></div></section><section class="box report-section"><h2>Deliberação e próximos passos</h2><div class="recommend">${esc(d.decision)}. A autorização para transferência depende de homologação por processo, confirmação das evidências, controles críticos, estimativa de horas e aceite dos responsáveis.</div><label class="field no-print">Observações da direção<textarea id="directorNotes" placeholder="Considerações do responsável pela avaliação...">${esc(c.notes||'')}</textarea></label><div class="only-print" style="font-size:12px;line-height:1.7">${esc(c.notes||'Sem observações adicionais registradas.')}</div></section><div class="footnote" style="margin-top:18px">Metodologia interna de maturidade (0–100), não escala oficial ou auditoria. Critérios gerenciais preliminares. Evidências: referência informada pelo avaliador, sem validação automática de autenticidade. Arquivo gerado localmente pelo DMA Studio.</div>`}
function renderPortfolio(){let data=state.clinics.map(c=>({c,d:calc(c)}));let done=data.filter(x=>x.d.index!==null),avg=done.length?done.reduce((s,x)=>s+x.d.index,0)/done.length:null;const rows=data.map(({c,d})=>`<tr><td><strong>${esc(c.name)}</strong><div class="muted">${esc(c.date||'Sem data')}</div></td><td>${d.complete}/106</td><td><strong>${fmt(d.index)}</strong></td><td>${esc(d.classification)}</td><td>${pct(d.coverage)}</td><td><button class="smallbtn" data-select="${esc(c.id)}">Abrir</button></td></tr>`).join('');$('portfolio').innerHTML=`<section class="cards"><div class="card"><div class="kicker">Clínicas cadastradas</div><div class="metric">${data.length}</div></div><div class="card"><div class="kicker">Diagnósticos completos</div><div class="metric">${done.length}</div></div><div class="card"><div class="kicker">Média dos completos</div><div class="metric">${fmt(avg)}</div></div><div class="card"><div class="kicker">Maturidade alta</div><div class="metric">${done.filter(x=>x.d.index>=state.config.high).length}</div></div></section><section class="box"><div class="section-head"><h2>Carteira de clínicas</h2><button class="btn primary no-print" id="addClinicPortfolio">+ Adicionar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Clínica</th><th>Respostas</th><th>DMA</th><th>Classificação</th><th>Evidências</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="box"><h2>Comparação entre clínicas</h2><p>Notas consolidadas de diagnósticos completos; não inclui avaliações em andamento.</p>${done.length?done.map(({c,d})=>`<div class="module-row"><span class="label-name" title="${esc(c.name)}">${esc(c.name.slice(0,16))}</span><div class="bar"><span style="width:${d.index}%"></span></div><span class="score">${fmt(d.index)}</span></div>`).join(''):'<div class="empty">Nenhum diagnóstico finalizado para comparar.</div>'}</section>`}
function renderSettings(){const c=cur();$('settings').innerHTML=`<section class="box"><h2>Identificação da clínica selecionada</h2><p>Esses dados aparecem automaticamente no REDA.</p><div class="fields"><label class="field">Nome da clínica<input id="clinicName" value="${esc(c.name)}"></label><label class="field">Responsável pela avaliação<input id="clinicManager" value="${esc(c.manager||'')}"></label><label class="field">Data do diagnóstico<input type="date" id="clinicDate" value="${esc(c.date||'')}"></label></div></section><section class="box"><h2>Parâmetros de decisão</h2><p>Critérios gerenciais internos, ajustáveis pela direção. Alterações são aplicadas imediatamente.</p><div class="fields">${[['threshold','Maturidade geral aceitável'],['high','Maturidade alta'],['finMin','Mínimo financeiro'],['pesMin','Mínimo pessoal'],['evidenceMin','Cobertura mínima de evidências']].map(([k,label])=>`<label class="field">${label} (%)<input type="number" min="0" max="100" id="config-${k}" value="${state.config[k]}"></label>`).join('')}</div><div class="attention" style="margin-top:16px">Controles-gatilho que exigem nota mínima 3 e revisão: ${criticalCodes.join(', ')}. Risco classificado como crítico impede recomendação automática de prontidão.</div></section><section class="box"><h2>Dados e privacidade</h2><p>Este protótipo funciona localmente no navegador. Os dados são guardados no armazenamento local disponível nesta instalação do navegador, sem servidor e sem sincronização entre dispositivos. O armazenamento pode ser apagado ao limpar dados do navegador ou mudar de computador. Use exportações JSON para backup seguro.</p><div class="toolbar no-print"><button class="btn primary" id="importBtn">Importar backup JSON</button><button class="btn" id="downloadCSV">Exportar diagnóstico CSV</button><button class="btn" id="resetClinic">Limpar respostas desta clínica</button></div><div class="help">Não utilize dados de pacientes, senhas ou documentos sensíveis neste protótipo. Para uso multiusuário e proteção institucional, será necessária infraestrutura autenticada, controle de acesso, banco de dados e análise de segurança/LGPD.</div></section><section class="box"><h2>Sobre a metodologia</h2><p>Foram preservadas as 106 perguntas do arquivo DMA Integrado sem Contratos. Pesos: FIN 33,33%, PES/PRO/TEC/GOV 16,67% cada. Dimensões recebem seus pesos internos e os itens aplicáveis são ponderados conforme a planilha de origem. Itens NA exigem justificativa; notas incompletas impedem índice final.</p><div class="step">Nível 0: inexistente · 1: informal · 2: parcialmente estruturado · 3: estruturado e evidenciado · 4: controlado, monitorado e corrigido.</div></section>`}
function updateMeta(){const c=cur();$('clinicSelect').innerHTML=state.clinics.map(x=>`<option value="${esc(x.id)}" ${x.id===state.active?'selected':''}>${esc(x.name)}</option>`).join('');const meta={dashboard:['Visão gerencial','Indicadores consolidados de maturidade administrativa'],questions:['Diagnóstico DMA','Preencha as 106 verificações e registre evidências'],plan:['Plano de ação','Itens com nota 0–1 ou risco alto/crítico, em ordem de prioridade'],workload:['Carga operacional','Estimativa de horas mensais da administradora (sem gestão de contratos)'],report:['Relatório executivo REDA','Prévia dinâmica pronta para imprimir ou salvar como PDF'],portfolio:['Carteira de clínicas','Comparação e acompanhamento de diagnósticos'],settings:['Configurações','Identificação, metodologia e gestão dos dados']};$('viewTitle').textContent=meta[view][0];$('subtitle').textContent=meta[view][1];$('eyebrow').textContent=esc(c.name).toUpperCase();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(el=>el.classList.toggle('hidden',el.id!==view))}
function render(){updateMeta();if(view==='dashboard')renderDashboard();if(view==='questions')renderQuestions();if(view==='plan')renderPlan();if(view==='workload')renderWorkload();if(view==='report')renderReport();if(view==='portfolio')renderPortfolio();if(view==='settings')renderSettings()}
function switchTo(v){view=v;window.scrollTo(0,0);render()}
function addClinic(){let name=prompt('Nome da clínica:','Nova clínica');if(name===null)return;name=name.trim()||'Nova clínica';let id='c-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);state.clinics.push({id,name,manager:'',date:new Date().toISOString().slice(0,10),notes:'',answers:{}});state.active=id;store();switchTo('questions')}
function download(name,body,type){let b=new Blob([body],{type:type||'application/json;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(b);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
function csvExport(){let c=cur();let lines=[['Código','Módulo','Dimensão','Pergunta','Nota','Método','Risco','Evidência','Achado','Ação','Responsável','Justificativa NA'],...QQ.map(q=>{let a=answer(c,q.id);return [q.id,q.m,q.dim,q.question,a.score??'',a.method||'',a.risk||'',a.evidence||'',a.finding||'',a.action||'',a.owner||'',a.justification||'']})];download('DMA_'+c.name.replace(/[^a-zA-Z0-9À-ÿ_-]/g,'_')+'.csv','\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){switchTo(v.dataset.view);return}let go=e.target.closest('[data-go]');if(go){switchTo(go.dataset.go);return}let sc=e.target.closest('[data-score]');if(sc){let[id,v]=sc.dataset.score.split('|');const a=cur().answers[id]||{};a.score=v==='NA'?'NA':Number(v);cur().answers[id]=a;store();renderQuestions();return}let ex=e.target.closest('[data-expand]');if(ex){showDetails[ex.dataset.expand]=!showDetails[ex.dataset.expand];renderQuestions();return}let sel=e.target.closest('[data-select]');if(sel){state.active=sel.dataset.select;store();switchTo('dashboard');return}if(e.target.id==='addClinicPortfolio'){addClinic();return}if(e.target.id==='importBtn'){$('fileImport').click();return}if(e.target.id==='downloadCSV'){csvExport();return}if(e.target.id==='resetClinic'){if(confirm('Apagar todas as respostas desta clínica? Exporte um backup antes desta ação.')){cur().answers={};store();render()}return}})
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.field){const[id,k]=t.dataset.field.split('|');cur().answers[id]??={};cur().answers[id][k]=t.value;store();return}if(t.id==='clinicSelect'){state.active=t.value;store();render();return}if(t.id==='moduleFilter'){moduleFilter=t.value;renderQuestions();return}if(t.id==='statusFilter'){statusFilter=t.value;renderQuestions();return}if(t.id==='clinicName'){cur().name=t.value.trim()||'Clínica sem nome';store();render();return}if(t.id==='clinicManager'){cur().manager=t.value;store();return}if(t.id==='clinicDate'){cur().date=t.value;store();return}if(t.id.startsWith('config-')){state.config[t.id.slice(7)]=Math.max(0,Math.min(100,Number(t.value)||0));store();return}if(t.id==='directorNotes'){cur().notes=t.value;store();return}})
document.addEventListener('input',e=>{let t=e.target;if(t.id==='searchQ'){search=t.value;let active=document.activeElement;const c=cur();$('questionList').innerHTML=QQ.filter(q=>(moduleFilter==='TODOS'||q.m===moduleFilter)&&(statusFilter==='TODOS'||(statusFilter==='PENDENTE'&&answer(c,q.id).score===undefined)||(statusFilter==='CRITICO'&&['Alto','Crítico'].includes(answer(c,q.id).risk)))&&(`${q.id} ${q.question} ${q.title}`).toLowerCase().includes(search.toLowerCase())).map(q=>questionCard(q,c)).join('')||'<div class="empty">Nenhuma pergunta encontrada.</div>';return}if(t.dataset.field){const[id,k]=t.dataset.field.split('|');cur().answers[id]??={};cur().answers[id][k]=t.value;store()}if(t.id==='directorNotes'){cur().notes=t.value;store()}})
$('addClinic').addEventListener('click',addClinic);$('exportJson').addEventListener('click',()=>download('DMA_Studio_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({schema:'dma-studio-106-v2',exportedAt:new Date().toISOString(),...state},null,2)));
$('printReport').addEventListener('click',()=>{switchTo('report');window.print()});$('fileImport').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.clinics)||!x.clinics.every(c=>c.id&&c.answers&&typeof c.answers==='object'))throw Error('Arquivo incompatível');if(confirm('Importar backup e substituir os dados locais atuais?')){state={clinics:x.clinics,active:x.active,config:{...defaults,...x.config}};if(!state.clinics.some(c=>c.id===state.active))state.active=state.clinics[0].id;store();render();alert('Dados importados.')}}catch(err){alert('Não foi possível importar o arquivo JSON: '+err.message)}e.target.value=''});

const DIMN={'FIN-1':'Faturamento e caixa','FIN-2':'Recebíveis e cartões','FIN-3':'Pagamentos','FIN-4':'Conciliação bancária','FIN-5':'Fluxo de caixa e gestão','FIN-6':'Papéis e controles','PES-1':'Cadastro','PES-2':'Jornada','PES-3':'Férias e benefícios','PES-4':'Folha','PES-5':'Processos de pessoal','PRO-1':'Documentação','PRO-2':'Papéis e alçadas','PRO-3':'Agenda e prazos','PRO-4':'Comunicação','PRO-5':'Continuidade e melhoria','TEC-1':'Inventário de sistemas','TEC-2':'Exportação e integração','TEC-3':'Qualidade de dados','TEC-4':'Acessos e segurança','TEC-5':'Backup e transição','GOV-1':'Alçadas e decisões','GOV-2':'Indicadores e reuniões','GOV-3':'Dependência dos sócios','GOV-4':'Planejamento'};
function planItems(c){const r={'Crítico':-10,'Alto':-5};return QQ.map(q=>({q,a:answer(c,q.id)})).filter(x=>(Number.isInteger(x.a.score)&&x.a.score<=1)||['Alto','Crítico'].includes(x.a.risk)).sort((a,b)=>((r[a.a.risk]??a.a.score)-(r[b.a.risk]??b.a.score))||(criticalCodes.includes(b.q.id)-criticalCodes.includes(a.q.id))||a.q.id.localeCompare(b.q.id))}
function renderPlan(){const c=cur(),items=planItems(c),pend=QQ.filter(q=>answer(c,q.id).score===undefined).length;const rows=items.map(({q,a})=>`<tr><td><strong>${q.id}</strong>${criticalCodes.includes(q.id)?' <span class="badge warn">gatilho</span>':''}<div class="muted">${title(q.m)} · ${esc(DIMN[q.dim]||q.dim)}</div></td><td>${esc(q.title)}</td><td>${a.score}</td><td>${esc(a.risk||'Não classificado')}</td><td>${esc(a.finding||'—')}</td><td>${esc(a.action||'Definir ação')}</td><td>${esc(a.owner||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Nenhum item prioritário.</td></tr>';$('plan').innerHTML=`<section class="cards"><div class="card"><div class="kicker">Itens no plano</div><div class="metric">${items.length}</div></div><div class="card"><div class="kicker">Controles-gatilho abaixo de 3</div><div class="metric">${calc(c).blockers.length}</div></div><div class="card"><div class="kicker">Sem ação definida</div><div class="metric">${items.filter(x=>!x.a.action).length}</div></div><div class="card"><div class="kicker">Não verificados (NV)</div><div class="metric">${pend}</div></div></section><section class="box"><div class="section-head"><h2>Plano de ação</h2><button class="btn primary no-print" id="downloadPlan">Exportar plano CSV</button></div><p>Gerado automaticamente: nota 0 ou 1, ou risco alto/crítico. Preencha achado, ação e responsável no Diagnóstico.</p><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Verificação</th><th>Nota</th><th>Risco</th><th>Achado</th><th>Ação</th><th>Responsável</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
const WL_AREAS=['Pagamentos','Recebimentos e cartões','Conciliações','Pessoal administrativo','Relacionamento'];
function wl(c){c.workload??={};for(const a of WL_AREAS)c.workload[a]??={volume:'',min:'',fixed:''};c.workload.Supervisão??={volume:'',min:'',fixed:''};return c.workload}
function wlTotals(c){const w=wl(c);let tot=0;const rows=Object.entries(w).map(([a,r])=>{const v=(parseFloat(r.volume)||0)*(parseFloat(r.min)||0)/60,f=parseFloat(r.fixed)||0;tot+=v+f;return {a,v,f,t:v+f}});return {rows,tot}}
function renderWorkload(){const c=cur(),w=wl(c),t=wlTotals(c);$('workload').innerHTML=`<section class="box"><h2>Carga operacional mensal</h2><p>Registre apenas rotinas sob responsabilidade da administradora. Horas variáveis = volume × minutos por unidade ÷ 60. Não incluir gestão de contratos de fornecedores.</p><div class="table-wrap"><table class="table"><thead><tr><th>Área</th><th>Volume mensal</th><th>Min./unidade</th><th>Horas variáveis</th><th>Horas fixas</th><th>Total h/mês</th></tr></thead><tbody>${t.rows.map(({a,v,f,t:tt},i)=>`<tr><td><strong>${a}</strong></td>${['volume','min','fixed'].map((k,j)=>`${j==2?`<td id="wlv-${i}">${fmt(v)}</td>`:''}<td><input class="control" type="number" min="0" step="any" data-wl="${a}|${k}" value="${esc(w[a][k])}" style="width:110px"></td>`).join('')}<td id="wlt-${i}"><strong>${fmt(tt)}</strong></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5"><strong>Total mensal</strong></td><td id="wlTot"><strong>${fmt(t.tot)} h</strong></td></tr></tfoot></table></div><div class="help">Para uma mesma linha: preencha volume e minutos, e/ou horas fixas (reuniões, supervisão).</div></section>`}
document.addEventListener('input',e=>{const x=e.target;if(!x.dataset||!x.dataset.wl)return;const[a,k]=x.dataset.wl.split('|'),c=cur();wl(c)[a][k]=x.value;store();const t=wlTotals(c);t.rows.forEach((r,i)=>{const v=$('wlv-'+i),tt=$('wlt-'+i);if(v)v.textContent=fmt(r.v);if(tt)tt.innerHTML='<strong>'+fmt(r.t)+'</strong>'});$('wlTot').innerHTML='<strong>'+fmt(t.tot)+' h</strong>'});
document.addEventListener('click',e=>{if(e.target.id==='hideWelcome'){localStorage.setItem('dma-welcome-off','1');const b=$('welcomeBox');if(b)b.remove()}if(e.target.id==='downloadPlan'){const c=cur();const lines=[['Código','Módulo','Dimensão','Verificação','Nota','Risco','Achado','Ação','Responsável'],...planItems(c).map(({q,a})=>[q.id,title(q.m),DIMN[q.dim]||q.dim,q.title,a.score,a.risk||'',a.finding||'',a.action||'',a.owner||''])];download('DMA_Plano_'+c.name.replace(/[^a-zA-Z0-9À-ÿ_-]/g,'_')+'.csv','﻿'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}});
window.addEventListener('beforeprint',()=>{renderReport()});render();
</script></body></html>
